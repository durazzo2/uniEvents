name: UniEvents CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build & verify UniEvents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print build info
        run: |
          echo "=== UniEvents CI pipeline ==="
          echo "Author: Teodor Duracoski 223131"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Triggered by: ${GITHUB_ACTOR}"

      - name: List repository contents
        run: |
          echo "--- Repository contents ---"
          ls -la
          echo "--- Markdown files ---"
          find . -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" -type f

      - name: Preview README
        run: |
          echo "--- README preview ---"
          head -20 README.md

      - name: Done
        run: echo "=== Pipeline completed successfully ==="
